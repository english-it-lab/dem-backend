[project]
name = "backend"
version = "0.1.0"
description = "Digital event manager backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles",
    "alembic",
    "asyncpg",
    "email-validator",
    "fastapi",
    "pydantic-settings",
    "python-dotenv",
    "python-jose[cryptography]",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
    "reportlab",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

